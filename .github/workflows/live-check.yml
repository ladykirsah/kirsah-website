name: Live check

# Checks the real kirsah.com: after every deploy, and every morning at 09:00 Thailand time.
# A failure here sends GitHub's failed-workflow email.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait until Cloudflare serves this version
        if: github.event_name == 'push'
        run: |
          want=$(sha256sum public/index.html | cut -d' ' -f1)
          for i in $(seq 1 40); do
            got=$(curl -fsS "https://kirsah.com/?v=$GITHUB_SHA" | sha256sum | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then echo "Live after $((i * 15)) seconds"; exit 0; fi
            sleep 15
          done
          echo "::error::kirsah.com did not update within 10 minutes. Check the Cloudflare deploy."
          exit 1
      - run: npx playwright test
        env:
          CI: "true"
          LIVE_URL: https://kirsah.com
      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-report
          path: playwright-report/
          retention-days: 14
